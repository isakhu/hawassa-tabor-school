name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: educore
          POSTGRES_PASSWORD: educore
          POSTGRES_DB: educore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U educore -d educore_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app main.py

      - name: Verify application imports
        env:
          DATABASE_URL: postgresql+asyncpg://educore:educore@localhost:5432/educore_test
          SECRET_KEY: ci-only-secret-key
          ADMIN_EMAIL: ci-admin
          ADMIN_PASSWORD: ci-admin-password-123
          ADMIN_FULL_NAME: CI Admin
        run: python -c "import main; print(main.app.title)"
