# Docker Compose Configuration
# This file orchestrates all services for local development.
# Services defined here:
#   - db:       PostgreSQL 16 database with persistent volume
#   - backend:  FastAPI application (hot-reload via uvicorn --reload)
#   - frontend: Next.js development server (hot-reload)
#
# Usage:
#   Start all services:  docker-compose up --build
#   Stop all services:   docker-compose down
#   Reset database:      docker-compose down -v

version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Command will be defined in backend/Dockerfile

  # ── Next.js Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Command will be defined in frontend/Dockerfile

volumes:
  postgres_data:
